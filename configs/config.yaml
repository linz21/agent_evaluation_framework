project:
  name: agent-evaluation-framework
  author: Linlin Zhang
  github: linz21

# The system under evaluation lives in a SIBLING directory, same pattern
# as Project 3's own dependency on Project 2 (cross-project imports via
# explicit file-path loading — see src/eval/agent_runner.py for why a
# naive `sys.path` addition alone isn't enough, given the namespace
# collision found when building Project 3).
target_project:
  path: "../crop_advisory_react_agent"
  # Project 2 (agri_rag_literature_ga) also needed directly for golden
  # dataset drafting (real literature context) — a SIBLING of this
  # project, not derived from target_project.path (an earlier version
  # tried deriving it via Path(target_project.path).parent, which is
  # wrong: that just strips the last path component, resolving to this
  # project's grandparent directory, not project 2's actual location).
  project2_path: "../agri_rag_literature_ga"

# "Agent versions" being benchmarked — each is a real, already-implemented
# configuration switch in Project 3's own config.yaml (llm.provider,
# llm.model_name), not a new agent built for this project.
#
# REDUCED from 3 versions to 2 (dropped Qwen2.5-1.5B) — it's already
# well-established from Project 3's own development that it had clear
# synthesis failures, which is specifically what motivated moving to
# Qwen3-4B in the first place. The genuinely open, interesting question
# is Qwen3-4B (best local option) vs. Claude Sonnet 4.5 (API option) —
# the real local-vs-API reliability/cost tradeoff. This also roughly
# halves remaining API cost (fewer agent runs, fewer judge calls), and
# means only ONE pairwise comparison is needed, so multiple-comparison
# correction (src/stats/multiple_comparison.py) isn't required for this
# specific run — that module stays validated and ready if a third
# version is added later, but a single permutation test suffices here.
agent_versions:
  - id: "qwen3-4b"
    provider: "local"
    model_name: "Qwen/Qwen3-4B-Instruct-2507"
  - id: "claude-sonnet-4.5"
    provider: "anthropic"
    anthropic_model: "claude-sonnet-4-5"

golden_dataset:
  path: "data/golden_qa_pairs.json"
  # REDUCED from an original 100-question plan after a real, practical
  # cost concern: with a $5 Anthropic API budget, the full pipeline
  # (drafting + running Claude as one of 3 agent versions + LLM-judge
  # evaluation across all 3 versions) could total 500-700+ API calls at
  # 100 questions. 40 is a more realistic, still statistically meaningful
  # size — honest tradeoff is wider bootstrap CIs / less permutation-test
  # power, an acceptable limitation given the constraint.
  target_size: 40
  # Semi-automated build: an LLM drafts a candidate answer from real
  # retrieved passages (Project 2's corpus for literature questions, real
  # Project 1 API responses for yield questions), a human reviews/edits
  # every single one before it's added — never auto-accepted. See
  # scripts/build_golden_dataset.py.
  draft_llm_provider: "anthropic"  # drafting quality matters even though this is a "draft"
  draft_llm_model: "claude-sonnet-4-5"
  # Equal split across the 4 categories, kept simple given the reduced
  # scope — multi_tool retained (not dropped) since it's arguably the
  # most interesting test of genuine agent behavior (tool orchestration),
  # not just single-tool competency.
  category_targets:
    literature_only: 10
    yield_only: 10
    multi_tool: 10
    out_of_scope: 10

metrics:
  # LLM-as-judge for task accuracy — uses a DIFFERENT model than any
  # agent version being evaluated, to avoid a model favorably judging
  # its own outputs (a real, known risk in LLM-as-judge setups). This
  # matters concretely here: claude-sonnet-4.5 is ALSO one of the agent
  # versions being benchmarked, so the judge must be a genuinely
  # different model. Opus kept deliberately for this reason, despite
  # being the more expensive option — considered switching to Sonnet
  # itself for cost savings, but that would create exactly the
  # self-evaluation conflict this design avoids. The question-count
  # reduction (100 -> 40) already cuts total judge-call cost by 60%
  # regardless of which model is used.
  judge_provider: "anthropic"
  judge_model: "claude-opus-4-1"
  hallucination_check: true
  track_latency: true
  track_tool_calls: true

statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  permutation_test_iterations: 10000
  random_seed: 42  # reproducibility

leaderboard:
  results_dir: "data/results"
